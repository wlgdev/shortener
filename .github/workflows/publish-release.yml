name: deploy-prod

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: ${{ !startsWith(github.repository, 'wlgdev/template-') }}
    environment: PRODUCTION
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        uses: wlgdev/deploy/.github/actions/deploy@main
        with:
          pat: ${{ secrets.DEPLOY_TRIGGER_PAT }}
          target: "cc:shortener:8080"
          is_dev: "false"
          # Keep these coordinates aligned with docker-compose.yml.
          service_image_name: shlinkio/shlink
          service_image_tag: "5.1.7"
          env: |
            DEFAULT_DOMAIN=cc.wlg.tv
            INITIAL_API_KEY=${{ secrets.SHORTENER_INITIAL_API_KEY }}
            GEOLITE_KEY=${{ vars.SHORTENER_GEOLITE_KEY }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_USER_PASSWORD=${{ secrets.DB_USER_PASSWORD }}
