services:
  shortener:
    image: ${SERVICE_IMAGE_NAME}:${SERVICE_IMAGE_TAG}
    environment:
      - DEFAULT_DOMAIN=${DEFAULT_DOMAIN}
      - INITIAL_API_KEY=${INITIAL_API_KEY}
      - IS_HTTPS_ENABLED=true
      - GEOLITE_LICENSE_KEY=${GEOLITE_KEY}
      - DB_DRIVER=maria
      - DB_NAME=shortener
      - DB_USER=shortener
      - DB_PASSWORD=${DB_USER_PASSWORD}
      - DB_HOST=db
      - DB_PORT=3306
    # Retain database connectivity when the deploy action adds proxy-network.
    networks:
      default: {}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
#    network_mode: host #The port is used = 8080
  restarter: # Restarts shortener on a period of time (sleep 604_800 = 7 days)
    image: docker
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    restart: unless-stopped
    depends_on:
      - shortener
    command: ["/bin/sh", "-c", "while true; do sleep 604800; docker restart shortener; done"]

  db:
    image: linuxserver/mariadb:11.8.8 # https://hub.docker.com/r/linuxserver/mariadb
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Europe/Moscow"

      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: "shortener"
      MYSQL_USER: "shortener"
      MYSQL_PASSWORD: ${DB_USER_PASSWORD}
    networks:
      default: {}
    volumes:
      - shortener_mariadb_data:/config
    healthcheck:
      test:
        - CMD-SHELL
        - 'mariadb -h 127.0.0.1 -u shortener -p"$$MYSQL_PASSWORD" -D shortener -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  shortener_mariadb_data: {}
